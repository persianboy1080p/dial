<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>تماس — ماژان</title>
<style>
:root{--bg:#F6F7F9;--cd:#fff;--tx:#1E2530;--mu:#5B6472;--ac:#2563EB}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#10141A;--cd:#1A212B;--tx:#EEF1F5;--mu:#A3ADBB;--ac:#7AA2FF}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px Tahoma,sans-serif;text-align:center}
main{max-width:420px;margin:auto;padding:48px 16px}
a{display:block;background:var(--ac);color:#fff;text-decoration:none;border-radius:14px;padding:16px;font-size:18px;font-weight:700;margin:16px 0}
p{color:var(--mu);font-size:14px;line-height:1.8}b{direction:ltr;unicode-bidi:embed;font-size:20px}
</style>
</head>
<body>
<main id="m"><p>شماره نامعتبر است.</p></main>
<script>
// شماره فقط در بخش # آدرس است و به هیچ سروری فرستاده نمی‌شود
(function(){var h=decodeURIComponent(location.hash.slice(1)),m=/^(tel|sms):(\+?\d{4,15})$/.exec(h);if(!m)return;
var call=m[1]=="tel",el=document.getElementById("m");
el.innerHTML='<b></b><a id="go"></a><p>اگر '+(call?"شماره‌گیر":"صفحه‌ی پیامک")+' خودکار باز نشد، دکمه‌ی بالا را بزنید.<br>بعد از '+(call?"تماس":"ارسال پیامک")+'، به برنامه‌ی ماژان برگردید تا نتیجه را ثبت کنید.</p>';
el.querySelector("b").textContent=m[2];var a=document.getElementById("go");a.href=h;a.textContent=call?"تماس با این شماره":"ارسال پیامک";
location.replace(h)})();
</script>
</body>
</html>
