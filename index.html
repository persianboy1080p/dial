<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>تماس — ماژان</title>
<style>
:root{--bg:#F6F7F9;--cd:#fff;--tx:#1E2530;--mu:#5B6472;--ac:#2563EB}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#10141A;--cd:#1A212B;--tx:#EEF1F5;--mu:#A3ADBB;--ac:#7AA2FF}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px Tahoma,sans-serif;text-align:center}
main{max-width:420px;margin:auto;padding:48px 16px}
a{display:block;background:var(--ac);color:#fff;text-decoration:none;border-radius:14px;padding:16px;font-size:18px;font-weight:700;margin:16px 0}
p{color:var(--mu);font-size:14px;line-height:1.8}b{direction:ltr;unicode-bidi:embed;font-size:20px}
</style>
</head>
<body>
<main id="m"><p>شماره نامعتبر است.</p></main>
<script>
// شماره و متن فقط در بخش # آدرس است و به هیچ سروری فرستاده نمی‌شود
(function(){var h;try{h=decodeURIComponent(location.hash.slice(1))}catch(e){return}var m=/^(tel|sms|share):(\+?\d{4,15})(\?body=[^#\s]{0,6000})?$/.exec(h);if(!m)return;
var k=m[1],body="";try{body=m[3]?decodeURIComponent(m[3].slice(6)):""}catch(e){}
var el=document.getElementById("m");
if(k=="share"){if(!body)return;el.innerHTML='<b></b><p id="tx"></p><a id="go" href="#">انتخاب پیام‌رسان و ارسال</a><a id="cp" href="#" style="background:transparent;color:var(--ac);border:1px solid var(--ac)">کپی متن</a><p>بعد از ارسال، به برنامه‌ی ماژان برگردید تا نتیجه ثبت شود.</p>';
el.querySelector("b").textContent=m[2];var t=document.getElementById("tx");t.textContent="«"+body+"»";t.style.cssText="color:inherit;background:rgba(127,127,127,.12);border-radius:12px;padding:10px";
var cp=function(){if(navigator.clipboard)navigator.clipboard.writeText(body).then(function(){document.getElementById("cp").textContent="متن کپی شد؛ در پیام‌رسان بچسبانید"})};
document.getElementById("cp").onclick=function(e){e.preventDefault();cp()};
document.getElementById("go").onclick=function(e){e.preventDefault();if(navigator.share)navigator.share({text:body}).catch(function(){});else cp()};return}
var call=k=="tel";
el.innerHTML='<b></b><a id="go"></a><p id="tx"></p><p>'+(call?"صفحه‌ی شماره‌گیر گوشی با همین شماره باز می‌شود. <br><strong>برای شروع تماس، دکمه‌ی سبز تماس را در شماره‌گیر بزنید.</strong>":"برنامه‌ی پیامک با همین متن باز می‌شود؛ دکمه‌ی ارسال را در آن بزنید.")+'<br>اگر خودکار باز نشد، دکمه‌ی آبی بالا را بزنید.<br>بعد، به برنامه‌ی ماژان برگردید تا نتیجه ثبت شود.</p>';
el.querySelector("b").textContent=m[2];if(body){var t2=document.getElementById("tx");t2.textContent="«"+body+"»";t2.style.cssText="color:inherit;background:rgba(127,127,127,.12);border-radius:12px;padding:10px"}
var a=document.getElementById("go");a.href=h;a.textContent=call?"باز کردن شماره‌گیر":"باز کردن پیامک";
location.replace(h)})();
</script>
</body>
</html>
